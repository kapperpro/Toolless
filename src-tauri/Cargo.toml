[package]
name = "toolless"
version = "0.1.0"
description = "Toolless – kleine, effiziente Werkzeugsammlung für den Desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "toolless_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

# Persistenz (Clipboard-Manager, Einstellungen)
rusqlite = { version = "0.32", features = ["bundled"] }
# System-Zwischenablage
arboard = "3"
# Autostart-Eintrag im Betriebssystem
auto-launch = "0.5"
# Ruhezustand blockieren
keepawake = "0.5"
# Spotify Web API (PKCE-Login, Wiedergabesteuerung)
rspotify = "0.13"
